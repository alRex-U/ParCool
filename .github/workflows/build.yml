# Push/PR: сборка на проверку (репо публичный, минуты бесплатные).
# Тег bfN: та же сборка + GitHub Release с jar'ом `<имя>-bfN.jar`; пак закрепляет его
# командой scripts/bump-fork.sh <мод> bfN в blockfield-modpack.
name: Build
on:
  push:
    branches: [main]
    tags: ["bf[0-9]*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      # v6 bundles proprietary caching under Gradle's Terms of Use; setup-gradle also validates wrappers by default.
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify JVM lint and regression tests, then build
        run: just build
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
          # Tags publish the jar as a release; branch builds only need it briefly, and Actions
          # storage over the free 0.5 GB stops GitHub-hosted runners.
          retention-days: 1
      - name: Release the jar under the tag
        if: startsWith(github.ref, 'refs/tags/bf')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          jars=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar')
          [ "$(printf '%s\n' "$jars" | wc -l)" -eq 1 ] || { echo "ожидался один jar, есть: $jars"; exit 1; }
          out="${jars%.jar}-$GITHUB_REF_NAME.jar"
          mv "$jars" "$out"
          test -f "release-notes/$GITHUB_REF_NAME.md" || { echo "missing release-notes/$GITHUB_REF_NAME.md: prepare it in the release PR"; exit 1; }
          just python scripts/release-notes-tool.py "release-notes/$GITHUB_REF_NAME.md" \
            --repository Blockfield/parcool-fabric --version "$GITHUB_REF_NAME"
          cp "release-notes/$GITHUB_REF_NAME.md" release-notes.md
          gh release create "$GITHUB_REF_NAME" "$out" release-notes.md --title "$(basename "$out" .jar)" --notes-file release-notes.md
