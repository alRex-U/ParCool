modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/alRex-U/ParCool/issues"
[[mods]]
modId = "parcool"
version = "${mod_version}"
displayName = "ParCool!"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/parcool"
logoFile = "../parcool_logo.png"
# credits = "" #optional
authors = "${mod_authors}"
description = '''
    This enable us act like parkour players.
    Enjoy Minecraft with cool actions!
    If Patchouli mod is installed, let's read ParCool Guide!
'''
[[mixins]]
config = "parcool.mixins.json"

[[dependencies.parcool]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.parcool]]
modId = "minecraft"
type = "required"
# This version range declares a minimum of the current minecraft version up to but not including the next major version
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Feathers
[[dependencies.parcool]]
modId = "${extern_feathers.mod_id}"
type = "optional"
versionRange = "${extern_feathers.version_range}"
ordering = "BEFORE"
side = "BOTH"

# Better Third Person
[[dependencies.parcool]]
modId = "${extern_betterthirdperson.mod_id}"
type = "optional"
versionRange = "${extern_betterthirdperson.version_range}"
ordering = "NONE"
side = "BOTH"

# Shoulder Surfing
[[dependencies.parcool]]
modId = "${extern_shouldersurfing.mod_id}"
type = "optional"
versionRange = "${extern_shouldersurfing.version_range}"
ordering = "NONE"
side = "BOTH"

# EpicFight
[[dependencies.parcool]]
modId = "${extern_epicfight.mod_id}"
type = "optional"
versionRange = "${extern_epicfight.version_range}"
ordering = "NONE"
side = "BOTH"
