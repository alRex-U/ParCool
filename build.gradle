plugins {
    id 'java-library'
    id 'idea'
    id 'fabric-loom' version '1.11-SNAPSHOT'
}

version = "${project.minecraft_version}-${project.mod_version}-fabric"
group = 'com.alrex'

base {
    archivesName = 'ParCool'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

loom {
    accessWidenerPath = file('src/main/resources/parcool.accesswidener')
    mixin { defaultRefmapName = 'parcool.refmap.json' }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://mvn.devos.one/snapshots/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    // exclusiveContent: иначе Gradle ищет maven.modrinth во всех репозиториях подряд
    // и падает на первом же, до которого не достучался.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Те же маппинги, что у апстрима на NeoForge: ванильные имена при переезде не меняются.
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Отдаёт net.neoforged.neoforge.common.ModConfigSpec под тем же именем пакета,
    // поэтому config/ParCoolConfig.java (986 строк) едет без единой правки.
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

    // События форджевой формы поверх Fabric: LivingFallEvent, EntityJoinLevelEvent,
    // ViewportEvent.ComputeCameraAngles, InputEvent.InteractionKeyMappingTriggered.
    for (module in ['core', 'entity', 'client_events']) {
        modImplementation "io.github.fabricators_of_create.Porting-Lib:${module}:${project.porting_lib_version}"
    }

    // Только ради com.tacz.guns.api.item.IGun в extern/tacz; в рантайме мод не обязателен.
    modCompileOnly "maven.modrinth:tacz-refabricated:${project.tacz_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

tasks.register('lintJava', JavaCompile) {
    dependsOn 'testClasses'
    source sourceSets.main.allJava, sourceSets.test.allJava
    classpath = sourceSets.main.compileClasspath + sourceSets.test.compileClasspath + sourceSets.main.output + sourceSets.test.output
    destinationDirectory = layout.buildDirectory.dir('classes/java/lint')
    options.annotationProcessorPath = files()
    options.compilerArgs += ['-proc:none', '-Xlint:divzero,empty,fallthrough,finally,-removal', '-Werror']
}
tasks.named('check') { dependsOn tasks.named('lintJava') }
