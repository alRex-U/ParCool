import me.modmuss50.mpp.ReleaseType

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '1.+'
    id 'me.modmuss50.mod-publish-plugin' version '1.+'
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = "https://maven.theillusivec4.top/" }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

version = "${minecraft_version}-${mod_version}"
group = 'com.alrex'

base {
    archivesName = 'ParCool'
}

neoForge {
    version = neoforge_version

    validateAccessTransformers = true
    accessTransformers.from 'accesstransformer.cfg'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    //compileOnly "top.theillusivec4.curios:curios-forge:${curios_version}:api"
    //runtimeOnly "top.theillusivec4.curios:curios-forge:${curios_version}"
    //compileOnly(fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}"))
    //runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    compileOnly "curse.maven:paraglider-289240:${paraglider_file_id}"
    runtimeOnly "curse.maven:paraglider-289240:${paraglider_file_id}"

    compileOnly "curse.maven:ShoulderSurfing-243190:${shouldersurfing_file_id}"
    compileOnly "curse.maven:BetterThirdPerson-435044:${betterthirdperson_file_id}"

    compileOnly "curse.maven:EpicFight-405076:${epicfight_file_id}"
    //runtimeOnly "curse.maven:EpicFight-405076:${epicfight_file_id}"
}

tasks.register("minifyJsonResource", MinifyJsonTask) {
    inputDir = project.file("src/template/resources-minified")
    outputDir = project.file("src/generated/resources-minified-json")
}

tasks.register("generateModMetadata", ProcessResources) {
    var properties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neoforge_version        : neoforge_version,
            neoforge_version_range  : neoforge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : 'ParCool',
            mod_license             : 'Lesser General Public License version 3',
            mod_version             : mod_version,
            mod_authors             : 'alRex_U',
            extern_feathers         : [
                    mod_id       : 'paraglider',
                    version_range: paraglider_version_range
            ],
            extern_shouldersurfing  : [
                    mod_id: 'shouldersurfing',
                    version_range: shouldersurfing_version_range
            ],
            extern_betterthirdperson: [
                    mod_id: 'betterthirdperson',
                    version_range: betterthirdperson_version_range
            ],
            extern_epicfight        : [
                    mod_id: 'epicfight',
                    version_range: epicfight_version_range
            ],
            extern_curios           : [
                    mod_id       : 'curios',
                    version_range: curios_version_range
            ]
    ]
    inputs.properties properties
    expand properties
    with copySpec {
        from("src/template/resources") {
            include 'META-INF/neoforge.mods.toml'
        }
    }
    into "src/generated/resources"
}

sourceSets {
    main.java {
        srcDir "src/generated/java"
    }
    main.resources {
        srcDir tasks.named("generateModMetadata")
        srcDir tasks.named("minifyJsonResource")
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "ParCool!",
                "Specification-Vendor" : "alRex-U",
                "Specification-Version" : "${mod_version}",
                "Implementation-Title"    : project.name,
                "Implementation-Version": "${mod_version}",
                "Implementation-Vendor": "alRex-U",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "TweakClass"              : "org.spongepowered.asm.launch.MixinTweaker",
                "MixinConfigs"            : "parcool.mixins.json"
        ])
    }
    finalizedBy('reobfJar')
}
publishMods {
    type = ReleaseType.of(release_type)
    file = jar.archiveFile
    var changelogText = project.layout.projectDirectory.file("changelog/v_${mod_version}.md").asFile.getText()
    changelog = changelogText
    modLoaders.add('forge')

    displayName = "${minecraft_version}-${mod_version}"
    version = "${minecraft_version}-${mod_version}"

    curseforge {
        projectId = '482378'
        accessToken = providers.environmentVariable('API_TOKEN_PARCOOL_CURSEFORGE')
        minecraftVersions.add(minecraft_version)

        clientRequired = true
        serverRequired = true

        optional('parcool-compatibility-addon')

        announcementTitle = 'Download from CurseForge'
    }
    modrinth {
        projectId = 'Fsvx2bdR'
        accessToken = providers.environmentVariable('API_TOKEN_PARCOOL_MODRINTH')
        minecraftVersions.add(minecraft_version)

        announcementTitle = 'Download from Modrinth'
    }
    discord {
        username.set("Update Notification")
        avatarUrl.set("https://i.imgur.com/FrxDviN.png")
        content = """\
            <@&1074034800849059930>
            # ParCool: ${minecraft_version}-${mod_version} is released!
            
""".stripIndent() + changelogText
        webhookUrl = providers.environmentVariable('API_TOKEN_PARCOOL_DISCORD_WEBHOOK')
        dryRunWebhookUrl = providers.environmentVariable('API_TOKEN_PARCOOL_DISCORD_WEBHOOK_DRY_RUN')
        setPlatforms(publishMods.platforms.curseforge, publishMods.platforms.modrinth)
        style {
            look = 'MODERN'
            link = 'BUTTON'
            thumbnailUrl = 'https://i.imgur.com/pibqOcC.png'
        }
    }
}